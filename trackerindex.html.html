    // ----------------------------------------------------------------------------
    const DateUtils = {
      toKey(dateObj = new Date()) {
        const d = new Date(dateObj);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      },
      fromKey(key) {
        const [y, m, d] = key.split('-').map(Number);
        return new Date(y, m - 1, d);
      },
      addDays(key, days) {
        const d = this.fromKey(key);
        d.setDate(d.getDate() + days);
        return this.toKey(d);
      },
      getMondayOfWeek(key) {
        const d = this.fromKey(key);
        const day = d.getDay(); // 0 Sun, 1 Mon ... 6 Sat
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        d.setDate(diff);
        return this.toKey(d);
      },
      formatDisplay(key, opts = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) {
        return this.fromKey(key).toLocaleDateString('en-US', opts);
      },
      getDayIndexMon0(key) {
        // 0 = Mon, 1 = Tue, ..., 6 = Sun
        const day = this.fromKey(key).getDay();
        return day === 0 ? 6 : day - 1;
      },
      getDayName(key) {
        const names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        return names[this.getDayIndexMon0(key)];
      }
    };

    // ----------------------------------------------------------------------------
    // 3. CENTRALIZED STATE & VERSIONED LOCALSTORAGE MANAGER
    // ----------------------------------------------------------------------------
    const STORAGE_KEY = 'fittrack_state_v1';

    function createInitialState() {
      const todayKey = DateUtils.toKey(new Date());
      const transitionMondayKey = DateUtils.getMondayOfWeek(todayKey);
      const transitionTuesdayKey = DateUtils.addDays(transitionMondayKey, 1);
      const regularStartMondayKey = DateUtils.addDays(transitionMondayKey, 7);

      const monTemplate = DEFAULT_TEMPLATES['MIXED_MON'];

        startedAt: DateUtils.fromKey(transitionMondayKey).getTime() + 17 * 3600 * 1000,

          const meta = EXERCISE_DB.find(e => e.id === exId);
          const tplOverride = monTemplate.exerciseOverrides?.[exId] || {};
          const numSets = tplOverride.sets || meta.defaultSets;

            name: meta.name,
            primary: meta.primary,
            targetReps,
            warmup: { weight: '', reps: '12', completed: true },

    const Store = {
      state: null,

      init() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.version === 1 && parsed.profile && parsed.scheduleConfig) {
              this.state = this.migrate(parsed);
              this.save();
              return;
            }
          }
        } catch (err) {
          console.error('LocalStorage load error, falling back to clean state:', err);
        }
        this.state = createInitialState();
        this.save();
      },

      migrate(data) {
        const base = createInitialState();
        const merged = {
          ...base,
          ...data,
          profile: { ...base.profile, ...(data.profile || {}) },
          scheduleConfig: { ...base.scheduleConfig, ...(data.scheduleConfig || {}) },
          templates: {
            ...base.templates,
            ...(data.templates || {}),
            // Ensure Day 1 & Day 2 Full Body A/B transition updates apply cleanly
            MIXED_MON: base.templates.MIXED_MON,
            MIXED_TUE: base.templates.MIXED_TUE
          },
          ui: { ...base.ui, ...(data.ui || {}) }
        };

        // Sync initial Monday pre-logged session if it hasn't been manually edited with custom weights yet
        const initIdx = merged.sessions.findIndex(s => s.id && s.id.endsWith('_init'));
        if (initIdx !== -1) {
          const hasCustomWeights = merged.sessions[initIdx].exercises.some(ex => ex.sets.some(st => st.weight && st.weight !== ''));
          if (!hasCustomWeights) {
            merged.sessions[initIdx] = base.sessions[0];
          }
        }
        return merged;
      },

      save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        } catch (err) {
          console.error('LocalStorage save error:', err);
          App.showToast('Storage warning: Could not save to browser storage.', 'danger');
        }
      },

      resetAll() {
        localStorage.removeItem(STORAGE_KEY);
        this.state = createInitialState();
        this.save();
      }
    };

    // ----------------------------------------------------------------------------
    // 4. SCHEDULING LOGIC ENGINE (PHASE 1 TRANSITION -> PHASE 2 REGULAR PPL)
    // ----------------------------------------------------------------------------
    const Scheduler = {
      /**
       * Determines the scheduled templateId and phase info for ANY calendar dateKey (YYYY-MM-DD).
       * Phase 1 (Custom Transition Week):
       *   Mon: MIXED_MON (already completed manually)
       *   Tue: MIXED_TUE (current mixed training session)
       *   Wed: LEGS_A
       *   Thu: PUSH_B
       *   Fri: PULL_B
       *   Sat: LEGS_B
       *   Sun: REST
       * Phase 2 (Starting next Monday, recurring forever):
       *   Mon: PUSH_A, Tue: PULL_A, Wed: LEGS_A, Thu: PUSH_B, Fri: PULL_B, Sat: LEGS_B, Sun: REST
       */
      getScheduleForDate(dateKey) {
        const cfg = Store.state.scheduleConfig;

        // 1. Check explicit manual date override first (rescheduled / custom edit)
        if (cfg.dateOverrides && cfg.dateOverrides[dateKey]) {
          const overrideId = cfg.dateOverrides[dateKey];
          const tpl = Store.state.templates[overrideId] || Store.state.templates['REST'];
          return {
            dateKey,
            templateId: overrideId,
            template: tpl,
            phase: dateKey < cfg.regularPhaseStartMonday ? 'Phase 1: Custom Transition Week' : 'Phase 2: Regular PPL Split',
            isTransition: dateKey < cfg.regularPhaseStartMonday,
            isOverride: true
          };
        }

        const dayIdx = DateUtils.getDayIndexMon0(dateKey); // 0=Mon ... 6=Sun
        const isTransitionWeek = dateKey >= cfg.transitionWeekMonday && dateKey < cfg.regularPhaseStartMonday;

        let templateId = 'REST';
        if (isTransitionWeek) {
          const transitionMap = ['MIXED_MON', 'MIXED_TUE', 'LEGS_A', 'PUSH_B', 'PULL_B', 'LEGS_B', 'REST'];
          templateId = transitionMap[dayIdx];
        } else {
          const regularMap = ['PUSH_A', 'PULL_A', 'LEGS_A', 'PUSH_B', 'PULL_B', 'LEGS_B', 'REST'];
          templateId = regularMap[dayIdx];
        }

        const template = Store.state.templates[templateId] || Store.state.templates['REST'];
        return {
          dateKey,
          templateId,
          template,
          phase: isTransitionWeek ? 'Phase 1: Custom Transition Week' : 'Phase 2: Regular PPL × 2 Split',
          isTransition: isTransitionWeek,
          isOverride: false
        };
      },

      getDayStatus(dateKey) {
        const todayKey = DateUtils.toKey(new Date());
        const sched = this.getScheduleForDate(dateKey);
        const sessionsOnDate = Store.state.sessions.filter(s => s.date === dateKey);
        const activeOnDate = Store.state.activeSession && Store.state.activeSession.date === dateKey ? Store.state.activeSession : null;
        const attended = Boolean(Store.state.attendance[dateKey]?.attended);

        const completedSession = sessionsOnDate.find(s => s.status === 'completed');
        const partialSession = sessionsOnDate.find(s => s.status === 'partial');

        if (activeOnDate) {
          return { code: 'in_progress', label: 'In Progress', attended, sched, session: activeOnDate };
        }
        if (completedSession) {
          return { code: 'completed', label: 'Completed', attended: true, sched, session: completedSession };
        }
        if (partialSession) {
          return { code: 'partial', label: 'Partial', attended, sched, session: partialSession };
        }
        if (sched.template.isRest) {
          return { code: 'rest', label: 'Rest Day', attended, sched, session: null };
        }
        if (dateKey < todayKey) {
          return { code: 'missed', label: 'Missed', attended, sched, session: null };
        }
        if (dateKey === todayKey) {
          return { code: 'today', label: 'Today', attended, sched, session: null };
        }
        return { code: 'upcoming', label: 'Upcoming', attended, sched, session: null };
      }
    };

    // ----------------------------------------------------------------------------
    // 5. ANALYTICS & ATTENDANCE CALCULATOR (100% REAL SAVED DATA)
    // ----------------------------------------------------------------------------
    const AnalyticsEngine = {
      getAttendanceMetrics() {
        const today = new Date();
        const todayKey = DateUtils.toKey(today);
        const currentMonthPrefix = todayKey.slice(0, 7);
        const currentYearPrefix = todayKey.slice(0, 4);

        const attendedDates = Object.keys(Store.state.attendance)
          .filter(k => Store.state.attendance[k]?.attended)
          .sort();

        const visitsThisMonth = attendedDates.filter(d => d.startsWith(currentMonthPrefix)).length;
        const visitsThisYear = attendedDates.filter(d => d.startsWith(currentYearPrefix)).length;

        // Weekly attendance (Mon-Sun of current week)
        const weekMon = DateUtils.getMondayOfWeek(todayKey);
        let weeklyVisits = 0;
        let weeklyPlanned = 0;
        for (let i = 0; i < 7; i++) {
          const dk = DateUtils.addDays(weekMon, i);
          if (Store.state.attendance[dk]?.attended) weeklyVisits++;
          const sch = Scheduler.getScheduleForDate(dk);
          if (!sch.template.isRest) weeklyPlanned++;
        }

        // Monthly attendance percentage (attended days vs planned non-rest days up to today in current month)
        const year = today.getFullYear();
        const month = today.getMonth();
        const daysElapsedInMonth = today.getDate();
        let plannedDaysSoFar = 0;
        for (let day = 1; day <= daysElapsedInMonth; day++) {
          const dk = DateUtils.toKey(new Date(year, month, day));
          const sch = Scheduler.getScheduleForDate(dk);
          if (!sch.template.isRest) plannedDaysSoFar++;
        }
        const monthlyAttendancePct = plannedDaysSoFar > 0
          ? Math.min(100, Math.round((visitsThisMonth / plannedDaysSoFar) * 100))
          : 0;

        // Streaks (Rest days do not break a gym streak if surrounding training days are attended)
        let currentStreak = 0;
        let checkKey = todayKey;
        // If today hasn't been attended yet, start checking from yesterday
        if (!Store.state.attendance[checkKey]?.attended) {
          checkKey = DateUtils.addDays(checkKey, -1);
        }
        for (let i = 0; i < 365; i++) {
          const sch = Scheduler.getScheduleForDate(checkKey);
          const isAtt = Boolean(Store.state.attendance[checkKey]?.attended);
          if (isAtt) {
            currentStreak++;
          } else if (sch.template.isRest) {
            // Sunday rest day bridges streak seamlessly
          } else {
            break;
          }
          checkKey = DateUtils.addDays(checkKey, -1);
        }

        // Longest streak across all recorded dates
        let longestStreak = 0;
        if (attendedDates.length > 0) {
          let running = 0;
          let cursor = attendedDates[0];
          while (cursor <= todayKey) {
            const sch = Scheduler.getScheduleForDate(cursor);
            const isAtt = Boolean(Store.state.attendance[cursor]?.attended);
            if (isAtt) {
              running++;
              if (running > longestStreak) longestStreak = running;
            } else if (!sch.template.isRest) {
              running = 0;
            }
            cursor = DateUtils.addDays(cursor, 1);
          }
        }

        return {
          visitsThisMonth,
          visitsThisYear,
          weeklyVisits,
          weeklyPlanned,
          monthlyAttendancePct,
          currentStreak,
          longestStreak
        };
      },

      getWorkoutMetrics() {
        const sessions = Store.state.sessions;
        const completedWorkouts = sessions.filter(s => s.status === 'completed').length;

        let totalPlannedExercises = 0;
        let totalCompletedExercises = 0;

        sessions.forEach(s => {
          s.exercises.forEach(ex => {
            totalPlannedExercises++;
            const allWorkingDone = ex.sets.length > 0 && ex.sets.every(st => st.completed);
            if (allWorkingDone && !ex.skipped) totalCompletedExercises++;
          });
        });

        const exerciseCompletionPct = totalPlannedExercises > 0
          ? Math.round((totalCompletedExercises / totalPlannedExercises) * 100)
          : 0;

        return {
          completedWorkouts,
          totalSessions: sessions.length,
          totalPlannedExercises,
          totalCompletedExercises,
          exerciseCompletionPct
        };
      },

      getMuscleGroupVolume() {
        const groups = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Quadriceps', 'Hamstrings', 'Glutes', 'Calves', 'Forearms', 'Abs'];
        const map = {};
        groups.forEach(g => map[g] = { workingSets: 0, sessions: new Set() });

        Store.state.sessions.forEach(s => {
          s.exercises.forEach(ex => {
            const meta = EXERCISE_DB.find(e => e.id === ex.exerciseId);
            const primary = ex.primary || meta?.primary;
            if (primary && map[primary]) {
              const doneSets = ex.sets.filter(st => st.completed).length;
              if (doneSets > 0) {
                map[primary].workingSets += doneSets;
                map[primary].sessions.add(s.date);
              }
            }
          });
        });

        return groups.map(g => ({
          muscle: g,
          workingSets: map[g].workingSets,
          frequency: map[g].sessions.size
        }));
      },

      getStrengthHistory(exerciseId, rangeDays = '30') {
        const cutoff = rangeDays === 'all'
          ? '0000-00-00'
          : DateUtils.addDays(DateUtils.toKey(new Date()), -Number(rangeDays));

        const points = [];
        const sortedSessions = [...Store.state.sessions].sort((a, b) => a.date.localeCompare(b.date));
        sortedSessions.forEach(s => {
          if (s.date < cutoff) return;
          s.exercises.forEach(ex => {
            if (ex.exerciseId === exerciseId) {
              let topWeight = 0;
              ex.sets.forEach(st => {
                const w = parseFloat(st.weight);
                if (st.completed && !isNaN(w) && w > topWeight) topWeight = w;
              });
              if (topWeight > 0) {
                points.push({ date: s.date, weight: topWeight });
              }
            }
          });
        });
        return points;
      },

      getMonthlyComparison() {
        const now = new Date();
        const currPrefix = DateUtils.toKey(now).slice(0, 7);
        const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const prevPrefix = DateUtils.toKey(prevDate).slice(0, 7);

        const calcForMonth = (prefix) => {
          const visits = Object.keys(Store.state.attendance).filter(d => d.startsWith(prefix) && Store.state.attendance[d]?.attended).length;
          const mSessions = Store.state.sessions.filter(s => s.date.startsWith(prefix));
          const completed = mSessions.filter(s => s.status === 'completed').length;
          const avgDurationMin = mSessions.length > 0
            ? Math.round(mSessions.reduce((acc, s) => acc + (s.durationSeconds || 0), 0) / mSessions.length / 60)
            : 0;

          let plannedEx = 0;
          let doneEx = 0;
          mSessions.forEach(s => s.exercises.forEach(ex => {
            plannedEx++;
            if (ex.sets.every(st => st.completed) && !ex.skipped) doneEx++;
          }));
          const completionRate = plannedEx > 0 ? Math.round((doneEx / plannedEx) * 100) : 0;

          return { visits, completed, avgDurationMin, completionRate };
        };

        return {
          currentLabel: now.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
          prevLabel: prevDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
          current: calcForMonth(currPrefix),
          previous: calcForMonth(prevPrefix)
        };
      }
    };

      // --- LIVE WORKOUT CLOCK & REST TIMER ---
      tickWorkoutClock() {
        const active = Store.state.activeSession;
        const pill = document.getElementById('header-active-session-pill');
        const clockEl = document.getElementById('header-session-clock');
        const execClockEl = document.getElementById('exec-session-timer');

        if (active) {
          const elapsed = this.getActiveSessionSeconds(active);
          const formatted = this.formatDuration(elapsed);
          if (pill) {
            pill.classList.remove('hidden');
            pill.classList.add('flex');
          }
          if (clockEl) clockEl.textContent = formatted;
          if (execClockEl) execClockEl.textContent = formatted;
        } else if (pill) {
          pill.classList.add('hidden');
          pill.classList.remove('flex');
        }
      },

      getActiveSessionSeconds(session) {
        if (!session) return 0;
        if (session.paused) return session.accumulatedSeconds || 0;
        return (session.accumulatedSeconds || 0) + Math.floor((Date.now() - session.resumedAt) / 1000);
      },

      formatDuration(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      },

      setRestPreset(seconds) {
        this.restTimer.preset = seconds;
        this.restTimer.remaining = seconds;
        this.restTimer.running = false;
        if (this.restTimer.intervalId) clearInterval(this.restTimer.intervalId);
        this.updateTimerDisplays();
      },

      toggleRestTimer() {
        if (this.restTimer.running) {
          this.restTimer.running = false;
          clearInterval(this.restTimer.intervalId);
        } else {
          if (this.restTimer.remaining <= 0) this.restTimer.remaining = this.restTimer.preset;
          this.restTimer.running = true;
          this.restTimer.intervalId = setInterval(() => {
            this.restTimer.remaining--;
            this.updateTimerDisplays();
            if (this.restTimer.remaining <= 0) {
              this.restTimer.running = false;
              clearInterval(this.restTimer.intervalId);
              this.triggerTimerAlert();
            }
          }, 1000);
        }
        this.updateTimerDisplays();
      },

      resetRestTimer() {
        this.restTimer.running = false;
        if (this.restTimer.intervalId) clearInterval(this.restTimer.intervalId);
        this.restTimer.remaining = this.restTimer.preset;
        this.updateTimerDisplays();
      },

      updateTimerDisplays() {
        const m = Math.floor(Math.max(0, this.restTimer.remaining) / 60);
        const s = Math.max(0, this.restTimer.remaining) % 60;
        const text = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

        const hText = document.getElementById('header-timer-text');
        const sDisp = document.getElementById('sidebar-timer-display');
        const sBtn = document.getElementById('sidebar-timer-btn');
        const mDisp = document.getElementById('modal-timer-display');
        const mBtn = document.getElementById('modal-timer-toggle');

        if (hText) hText.textContent = text;
        if (sDisp) sDisp.textContent = text;
        if (sBtn) sBtn.textContent = this.restTimer.running ? 'Pause' : 'Start';
        if (mDisp) mDisp.textContent = text;
        if (mBtn) mBtn.textContent = this.restTimer.running ? 'Pause Timer' : 'Start Timer';
      },

      triggerTimerAlert() {
        this.showToast('Rest complete! Ready for your next working set.', 'success');
        if (navigator.vibrate) {
          try { navigator.vibrate([200, 100, 200]); } catch (e) {}
        }
        if (Store.state.profile.soundEnabled) {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.28);
          } catch (e) {}
        }
      },

      updateDailyRoutine(dateKey, field, val) {
        const sched = Scheduler.getScheduleForDate(dateKey);
        const r = this.getOrInitDailyRoutine(dateKey, sched.template);
        if (field === 'cycling_toggle') r.cycling.completed = Boolean(val);
        if (field === 'cycling_min') r.cycling.minutes = Number(val) || 5;
        if (field === 'pu_s1') r.pushups.set1Done = Boolean(val);
        if (field === 'pu_s2') r.pushups.set2Done = Boolean(val);
        if (field === 'pu_r1') r.pushups.set1Reps = Number(val) || 0;
        if (field === 'pu_r2') r.pushups.set2Reps = Number(val) || 0;
        if (field === 'pu_skip') {
          r.pushups.skippedSoreness = Boolean(val);
          if (val) { r.pushups.set1Done = false; r.pushups.set2Done = false; }
        }
        if (field === 'abs_done') r.abs.completed = Boolean(val);
        if (field === 'abs_val') r.abs.repsOrSec = String(val);
        if (field === 'fa_rev') r.forearms.revWristDone = Boolean(val);
        if (field === 'fa_wrist') r.forearms.wristDone = Boolean(val);

        Store.save();
        this.renderCurrentView();
      },

      // ============================================================================
      // VIEW 2: WORKOUT PLAN & LIVE WORKOUT EXECUTION SCREEN

        const active = Store.state.activeSession;
        if (active) {

      // --- LIVE WORKOUT EXECUTION SCREEN ---
      viewWorkoutExecution(session) {
        const totalSets = session.exercises.reduce((acc, ex) => ex.skipped ? acc : acc + ex.sets.length, 0);
        const completedSets = session.exercises.reduce((acc, ex) => ex.skipped ? acc : acc + ex.sets.filter(s => s.completed).length, 0);
        const completedExercises = session.exercises.filter(ex => !ex.skipped && ex.sets.every(s => s.completed)).length;
        const pct = totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 0;
        const elapsed = this.getActiveSessionSeconds(session);

        const sched = Scheduler.getScheduleForDate(session.date);
        const routine = this.getOrInitDailyRoutine(session.date, sched.template);

        return `

      // --- WORKOUT SESSION ACTIONS ---
      buildExerciseEntry(exId, template = null) {
        const meta = EXERCISE_DB.find(e => e.id === exId) || EXERCISE_DB[0];
        const tplOverride = template?.exerciseOverrides?.[exId] || {};
        const custom = Store.state.customExerciseConfig[exId] || {};
        const numSets = custom.sets || tplOverride.sets || meta.defaultSets || 3;
        const targetReps = custom.reps || tplOverride.reps || meta.defaultReps || '8–12';
        const lastW = this.getLastUsedWeight(exId);

        return {
          exerciseId: meta.id,
          name: meta.name,
          primary: meta.primary,
          targetReps,
          expanded: true,
          skipped: false,
          skipReason: '',
          notes: '',
          warmup: { weight: lastW ? String(Math.max(2.5, Math.round(lastW * 0.5 * 2) / 2)) : '', reps: '12', completed: false },
          sets: Array.from({ length: numSets }, () => ({
            weight: lastW ? String(lastW) : '',
            reps: '',
            completed: false
          }))
        };
      },

      getLastUsedWeight(exId) {
        const sorted = [...Store.state.sessions].sort((a, b) => b.date.localeCompare(a.date));
        for (const s of sorted) {
          for (const ex of s.exercises) {
            if (ex.exerciseId === exId) {
              let best = 0;
              ex.sets.forEach(st => {
                const w = parseFloat(st.weight);
                if (st.completed && !isNaN(w) && w > best) best = w;
              });
              if (best > 0) return best;
            }
          }
        }
        return null;
      },

      startWorkout(dateKey) {
        if (Store.state.activeSession) {
          this.showToast('You already have an active session in progress.', 'warning');
          this.navigate('workout');
          return;
        }
        const sched = Scheduler.getScheduleForDate(dateKey);
        if (sched.template.isRest && sched.template.exercises.length === 0) {
          this.showToast('Today is a scheduled Rest Day. Edit the split if you wish to train.', 'warning');
          return;
        }

        // Automatic Attendance Rule: First workout start of a calendar day records 1 gym visit (never duplicated)
        if (!Store.state.attendance[dateKey]?.attended) {
          Store.state.attendance[dateKey] = {
            attended: true,
            source: 'workout_start',
            recordedAt: new Date().toISOString()
          };
          this.showToast(`Gym attendance automatically recorded for ${DateUtils.formatDisplay(dateKey, { month: 'short', day: 'numeric' })}.`, 'success');
        }

        Store.state.activeSession = {
          id: `session_${dateKey}_${Date.now()}`,
          date: dateKey,
          templateId: sched.templateId,
          workoutName: sched.template.name,
          muscles: sched.template.muscles,
          startedAt: Date.now(),
          resumedAt: Date.now(),
          accumulatedSeconds: 0,
          paused: false,
          notes: '',
          exercises: sched.template.exercises.map(exId => this.buildExerciseEntry(exId, sched.template))
        };

        Store.state.ui.selectedDate = dateKey;
        Store.state.ui.currentTab = 'workout';
        Store.save();
        this.renderNavigation();
        this.renderCurrentView();
      },

      togglePauseActiveWorkout() {
        const s = Store.state.activeSession;
        if (!s) return;
        if (!s.paused) {
          s.accumulatedSeconds = this.getActiveSessionSeconds(s);
          s.paused = true;
        } else {
          s.resumedAt = Date.now();
          s.paused = false;
        }
        Store.save();
        this.renderCurrentView();
      },

      toggleExerciseExpand(exIdx) {
        const s = Store.state.activeSession;
        if (!s) return;
        s.exercises[exIdx].expanded = s.exercises[exIdx].expanded === false ? true : false;
        Store.save();
        this.renderCurrentView();
      },

      updateSetField(exIdx, setIdx, field, val) {
        const s = Store.state.activeSession;
        if (!s) return;
        if (setIdx === 'warmup') {
          s.exercises[exIdx].warmup[field] = val;
        } else {
          s.exercises[exIdx].sets[setIdx][field] = val;
        }
        Store.save();
      },

      toggleSetComplete(exIdx, setIdx) {
        const s = Store.state.activeSession;
        if (!s) return;
        if (setIdx === 'warmup') {
          s.exercises[exIdx].warmup.completed = !s.exercises[exIdx].warmup.completed;
        } else {
          const targetSet = s.exercises[exIdx].sets[setIdx];
          targetSet.completed = !targetSet.completed;
          // Auto-fill default reps if left empty when tapping Done for fast gym UX
          if (targetSet.completed && !targetSet.reps) {
            const parsedRep = parseInt(s.exercises[exIdx].targetReps, 10);
            targetSet.reps = !isNaN(parsedRep) ? String(parsedRep) : '10';
          }
          // Auto-start rest timer when completing a working set
          if (targetSet.completed) {
            this.resetRestTimer();
            this.toggleRestTimer();
          }
        }
        Store.save();
        this.renderCurrentView();
      },

      updateExerciseNotes(exIdx, text) {
        if (!Store.state.activeSession) return;
        Store.state.activeSession.exercises[exIdx].notes = text;
        Store.save();
      },

        this.openModal(`

            </div>
            <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
              ${list.map(alt => `

                </button>
              `).join('')}
            </div>
          </div>
        `);

      replaceActiveExercise(exIdx, newExId) {
        const s = Store.state.activeSession;
        if (!s) return;
        const oldName = s.exercises[exIdx].name;
        const replacement = this.buildExerciseEntry(newExId);

      confirmCancelWorkout() {
        this.openModal(`
          <div class="p-5">
            <h3 class="text-base font-bold text-[#172B4D]">Cancel Workout Session?</h3>
            <p class="text-xs text-[#667085] mt-1">Unsaved sets in this active session will be discarded. Your gym attendance record for today will remain intact.</p>

        Store.state.activeSession = null;
        Store.save();
        this.closeModal();
        this.renderNavigation();
        this.renderCurrentView();
        this.showToast('Active session discarded.', 'warning');
      },

      finishWorkout() {
        const s = Store.state.activeSession;
        if (!s) return;

        const durationSeconds = this.getActiveSessionSeconds(s);
        const totalSets = s.exercises.reduce((acc, ex) => ex.skipped ? acc : acc + ex.sets.length, 0);
        const completedSets = s.exercises.reduce((acc, ex) => ex.skipped ? acc : acc + ex.sets.filter(st => st.completed).length, 0);
        const totalReps = s.exercises.reduce((acc, ex) => ex.skipped ? acc : acc + ex.sets.reduce((rAcc, st) => rAcc + (st.completed ? (parseInt(st.reps, 10) || 0) : 0), 0), 0);
        const completedExercises = s.exercises.filter(ex => !ex.skipped && ex.sets.every(st => st.completed)).length;

        // Only mark workout 'completed' if all non-skipped exercises are finished; otherwise 'partial'
        const isFullyCompleted = completedSets > 0 && completedSets === totalSets;
        const status = isFullyCompleted ? 'completed' : 'partial';

        // Check for Personal Records (Strictly same exerciseId, never cross-comparing variations)
        const newPRs = [];
        s.exercises.forEach(ex => {
          if (ex.skipped) return;
          ex.sets.forEach(st => {
            if (!st.completed) return;
            const w = parseFloat(st.weight);
            const r = parseInt(st.reps, 10);
            if (!isNaN(w) && w > 0 && !isNaN(r) && r > 0) {
              const pr = Store.state.personalRecords[ex.exerciseId];
              if (!pr || w > pr.maxWeight || (w === pr.maxWeight && r > pr.bestRepsAtMax)) {
                Store.state.personalRecords[ex.exerciseId] = {
                  exerciseId: ex.exerciseId,
                  exerciseName: ex.name,
                  maxWeight: w,
                  bestRepsAtMax: r,
                  date: s.date,
                  history: [...(pr?.history || []), { date: s.date, weight: w, reps: r }]
                };
                if (!newPRs.find(p => p.exerciseId === ex.exerciseId)) {
                  newPRs.push({ exerciseId: ex.exerciseId, name: ex.name, weight: w, reps: r });
                }
              }
            }
          });
        });

        const finalized = {
          ...s,
          endedAt: Date.now(),
          durationSeconds,
          status
        };

        // Preserve historical records without overwriting other sessions
        Store.state.sessions.push(finalized);
        Store.state.activeSession = null;
        Store.save();

        this.renderNavigation();
        this.renderCurrentView();

        // Show Post-Workout Summary Modal
        this.openModal(`
          <div class="p-5">
            <div class="text-center mb-4">
              <div class="w-12 h-12 rounded-2xl bg-[#12B76A]/15 text-[#12B76A] flex items-center justify-center mx-auto mb-2">
                <i data-lucide="award" class="w-6 h-6"></i>
              </div>
              <h3 class="text-lg font-extrabold text-[#172B4D]">${isFullyCompleted ? 'Workout Completed!' : 'Partial Workout Saved'}</h3>
              <p class="text-xs text-[#667085]">${finalized.workoutName} • ${DateUtils.formatDisplay(finalized.date)}</p>
            </div>

            <div class="grid grid-cols-2 gap-2.5 mb-4">
              <div class="p-3 rounded-xl bg-[#F5F8FC] border border-gray-200">
                <span class="text-[11px] text-[#667085] block">Duration</span>
                <span class="text-base font-extrabold text-[#172B4D]">${this.formatDuration(durationSeconds)}</span>
              </div>
              <div class="p-3 rounded-xl bg-[#F5F8FC] border border-gray-200">
                <span class="text-[11px] text-[#667085] block">Exercises Done</span>
                <span class="text-base font-extrabold text-[#172B4D]">${completedExercises} / ${s.exercises.length}</span>
              </div>
              <div class="p-3 rounded-xl bg-[#F5F8FC] border border-gray-200">
                <span class="text-[11px] text-[#667085] block">Sets Completed</span>
                <span class="text-base font-extrabold text-[#155EEF]">${completedSets} / ${totalSets}</span>
              </div>
              <div class="p-3 rounded-xl bg-[#F5F8FC] border border-gray-200">
                <span class="text-[11px] text-[#667085] block">Total Repetitions</span>
                <span class="text-base font-extrabold text-[#172B4D]">${totalReps} reps</span>
              </div>
            </div>

            ${newPRs.length > 0 ? `
              <div class="p-3 rounded-xl bg-[#EAF1FF] border border-[#155EEF]/30 mb-4">
                <p class="text-xs font-extrabold text-[#155EEF] mb-1">New Personal Records Achieved!</p>
                ${newPRs.map(p => `<p class="text-xs font-semibold text-[#172B4D]">• ${p.name}: ${p.weight} kg × ${p.reps} reps</p>`).join('')}
              </div>
            ` : ''}

            <div class="mb-4">
              <label class="text-xs font-bold text-[#172B4D] block mb-1">Session Notes</label>

      saveProfileSettings() {

        p.heightCm = document.getElementById('set-height').value.trim();
        p.defaultRestSeconds = parseInt(document.getElementById('set-rest').value, 10) || 90;

        this.setRestPreset(p.defaultRestSeconds);
        Store.save();
        this.renderCurrentView();
        this.showToast('Profile and training preferences saved.', 'success');
      },

      exportJSON() {
        const blob = new Blob([JSON.stringify(Store.state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fittrack_backup_${DateUtils.toKey(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
        this.showToast('FITTRACK JSON backup exported.', 'success');
      },

      importJSON(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (!parsed || !parsed.profile || !parsed.scheduleConfig) {
              throw new Error('Invalid FITTRACK backup schema.');
            }
            Store.state = Store.migrate(parsed);
            Store.save();
            this.renderCurrentView();
            this.showToast('Backup restored successfully!', 'success');
          } catch (err) {
            this.showToast('Failed to import backup: Invalid JSON file.', 'danger');
          }
        };
        reader.readAsText(file);
      },

        this.openModal(`
          <div class="p-5">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-base font-bold text-[#172B4D]">Schedule & Missed Workout Manager</h3>
                <p class="text-xs text-[#667085]">${DateUtils.formatDisplay(dateKey, { weekday: 'long', month: 'short', day: 'numeric' })}</p>
              </div>
              <button onclick="App.closeModal()" class="p-1.5 rounded-lg text-[#667085] hover:bg-gray-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-[#667085] mb-3">
              Assign a specific workout or rest day to this calendar date without altering your recurring weekly PPL structure or historical records.
            </p>
            <div class="space-y-2 max-h-72 overflow-y-auto">
              ${templateOptions.map(t => `
                <button onclick="App.applyDateOverride('${dateKey}', '${t.id}')" class="w-full p-3 rounded-xl border text-left flex items-center justify-between transition ${
                  currentSched.templateId === t.id ? 'border-[#155EEF] bg-[#EAF1FF]/40' : 'border-gray-200 hover:border-[#155EEF]'
                }">
                  <div>
                    <span class="text-xs font-extrabold text-[#172B4D] block">${t.name}</span>
                    <span class="text-[11px] text-[#667085]">${t.muscles}</span>
                  </div>
                  ${currentSched.templateId === t.id ? '<span class="text-xs font-bold text-[#155EEF]">Selected</span>' : ''}
                </button>
              `).join('')}
            </div>
            ${currentSched.isOverride ? `
              <button onclick="App.clearDateOverride('${dateKey}')" class="w-full mt-3 py-2 rounded-xl bg-gray-100 text-xs font-bold text-[#172B4D]">
                Restore Default Scheduled Split
              </button>
            ` : ''}
          </div>
        `);
      },

      applyDateOverride(dateKey, templateId) {
        Store.state.scheduleConfig.dateOverrides[dateKey] = templateId;
        Store.save();
        this.closeModal();
        this.renderCurrentView();
        this.showToast(`Updated ${DateUtils.formatDisplay(dateKey, { month: 'short', day: 'numeric' })} to ${Store.state.templates[templateId].name}.`, 'success');
      },

      clearDateOverride(dateKey) {
        delete Store.state.scheduleConfig.dateOverrides[dateKey];
        Store.save();
        this.closeModal();
        this.renderCurrentView();
        this.showToast('Restored default schedule.', 'success');
      },

      openMixedDayEditorModal(dateKey) {
        const sched = Scheduler.getScheduleForDate(dateKey);
        const tpl = Store.state.templates[sched.templateId];
        if (!tpl) return;

        this.openModal(`
          <div class="p-5 overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-base font-bold text-[#172B4D]">Edit ${tpl.name} Exercises</h3>
                <p class="text-xs text-[#667085]">Customize exercises performed on your Phase 1 transition mixed days</p>
              </div>
              <button onclick="App.closeModal()" class="p-1.5 rounded-lg text-[#667085] hover:bg-gray-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-2 max-h-80 overflow-y-auto">
              ${EXERCISE_DB.map(ex => {
                const checked = tpl.exercises.includes(ex.id);
                return `
                  <label class="flex items-center justify-between p-2.5 rounded-xl border border-gray-200 cursor-pointer hover:bg-[#F5F8FC]">
                    <div>
                      <span class="text-xs font-bold text-[#172B4D] block">${ex.name}</span>
                      <span class="text-[11px] text-[#667085]">${ex.primary} • ${ex.defaultSets}×${ex.defaultReps}</span>
                    </div>
                    <input type="checkbox" ${checked ? 'checked' : ''} onchange="App.toggleMixedTemplateExercise('${tpl.id}', '${ex.id}', this.checked)" class="w-4 h-4 rounded accent-[#155EEF]" />
                  </label>
                `;
              }).join('')}
            </div>

            <button onclick="App.closeModal(); App.renderCurrentView();" class="w-full mt-4 py-2.5 rounded-xl bg-[#155EEF] text-white text-xs font-bold">
              Done Editing Mixed Workout
            </button>
          </div>
        `);
      },

      toggleMixedTemplateExercise(templateId, exId, isAdded) {
        const tpl = Store.state.templates[templateId];
        if (!tpl) return;
        if (isAdded && !tpl.exercises.includes(exId)) {
          tpl.exercises.push(exId);
        } else if (!isAdded) {
          tpl.exercises = tpl.exercises.filter(id => id !== exId);
        }
        Store.save();
      },

      editHistoricalSession(sessionId) {
        const session = Store.state.sessions.find(s => s.id === sessionId);
        if (!session) return;

        this.openModal(`
          <div class="p-5 overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-base font-bold text-[#172B4D]">Edit Recorded Session</h3>
                <p class="text-xs text-[#667085]">${session.workoutName} • ${DateUtils.formatDisplay(session.date)}</p>
              </div>
              <button onclick="App.closeModal()" class="p-1.5 rounded-lg text-[#667085] hover:bg-gray-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
              ${session.exercises.map((ex, exIdx) => `
                <div class="p-3 rounded-xl bg-[#F5F8FC] border border-gray-200 space-y-2">
                  <p class="text-xs font-extrabold text-[#172B4D]">${ex.name}</p>
                  ${ex.sets.map((st, sIdx) => `
                    <div class="grid grid-cols-12 items-center gap-2 text-xs">
                      <span class="col-span-3 font-semibold text-[#667085]">Set ${sIdx + 1}</span>
                      <input type="number" step="0.5" placeholder="kg" value="${st.weight}" onchange="App.updateHistoricalSet('${sessionId}', ${exIdx}, ${sIdx}, 'weight', this.value)" class="ft-input col-span-4 py-1.5 px-2 text-center" />
                      <input type="number" placeholder="reps" value="${st.reps}" onchange="App.updateHistoricalSet('${sessionId}', ${exIdx}, ${sIdx}, 'reps', this.value)" class="ft-input col-span-3 py-1.5 px-2 text-center" />
                      <input type="checkbox" ${st.completed ? 'checked' : ''} onchange="App.updateHistoricalSet('${sessionId}', ${exIdx}, ${sIdx}, 'completed', this.checked)" class="col-span-2 w-4 h-4 mx-auto accent-[#12B76A]" />
                    </div>
                  `).join('')}
                </div>
              `).join('')}

              <div>
                <label class="text-xs font-bold text-[#172B4D] block mb-1">Notes</label>
                <input type="text" value="${session.notes || ''}" onchange="App.updateHistoricalNotes('${sessionId}', this.value)" class="ft-input w-full px-3 py-2 text-xs font-normal" />
              </div>
            </div>

            <button onclick="App.closeModal(); App.renderCurrentView(); App.showToast('Historical record updated.', 'success');" class="w-full mt-4 py-2.5 rounded-xl bg-[#155EEF] text-white text-xs font-bold">
              Save Changes
            </button>
          </div>
        `);
      },

      updateHistoricalSet(sessionId, exIdx, setIdx, field, value) {
        const s = Store.state.sessions.find(sess => sess.id === sessionId);
        if (!s) return;
        s.exercises[exIdx].sets[setIdx][field] = value;
        Store.save();
      },

      updateHistoricalNotes(sessionId, notes) {
        const s = Store.state.sessions.find(sess => sess.id === sessionId);
        if (!s) return;
        s.notes = notes;
        Store.save();
      },

      openRecoveryModal(dateKey) {
        const existing = Store.state.recoveryLogs[dateKey] || { energy: 4, soreness: 2, sleep: 4, readiness: 4, note: '' };
        const metrics = [
          { key: 'energy', label: 'Overall Energy (1=Low, 5=High)' },
          { key: 'soreness', label: 'Muscle Soreness (1=Fresh, 5=Very Sore)' },
          { key: 'sleep', label: 'Sleep Quality (1=Poor, 5=Restorative)' },
          { key: 'readiness', label: 'Workout Readiness (1=Low, 5=Ready)' }
        ];

        this.openModal(`
          <div class="p-5">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="text-base font-bold text-[#172B4D]">Daily Recovery Check-In</h3>
                <p class="text-xs text-[#667085]">${DateUtils.formatDisplay(dateKey, { weekday: 'long', month: 'short', day: 'numeric' })}</p>
              </div>
              <button onclick="App.closeModal()" class="p-1.5 rounded-lg text-[#667085] hover:bg-gray-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-3">
              ${metrics.map(m => `
                <div>
                  <label class="text-xs font-bold text-[#172B4D] block mb-1.5">${m.label}</label>
                  <div class="grid grid-cols-5 gap-1.5">
                    ${[1, 2, 3, 4, 5].map(num => `
                      <button type="button" onclick="App.setRecoveryScore('${dateKey}', '${m.key}', ${num})" class="py-2 rounded-xl text-xs font-bold border transition ${
                        existing[m.key] === num ? 'bg-[#155EEF] border-[#155EEF] text-white' : 'bg-white border-gray-200 text-[#172B4D]'
                      }">${num}</button>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>

            ${(existing.soreness >= 4 || existing.energy <= 2) ? `
              <div class="mt-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-800">
                <strong>Gentle Recovery Reminder:</strong> Fatigue or soreness is elevated today. Prioritize thorough warm-ups, skip daily push-ups if chest/shoulders are sore, and never push through sharp joint pain.
              </div>
            ` : ''}

            <button onclick="App.closeModal(); App.renderCurrentView(); App.showToast('Recovery check-in saved.', 'success');" class="w-full mt-4 py-2.5 rounded-xl bg-[#155EEF] text-white text-xs font-bold">
              Save Recovery Check-In
            </button>
          </div>
        `);
      },

      setRecoveryScore(dateKey, key, val) {
        if (!Store.state.recoveryLogs[dateKey]) {
          Store.state.recoveryLogs[dateKey] = { energy: 4, soreness: 2, sleep: 4, readiness: 4, note: '' };
        }
        Store.state.recoveryLogs[dateKey][key] = val;
        Store.save();
        this.openRecoveryModal(dateKey);
      },

      // --- MODAL & TOAST UTILITIES ---
      openModal(innerHTML) {
        const backdrop = document.getElementById('modal-backdrop');
        const panel = document.getElementById('modal-panel');
        panel.innerHTML = innerHTML;
        backdrop.classList.remove('hidden');
        lucide.createIcons();
      },

      closeModal() {
        const backdrop = document.getElementById('modal-backdrop');
        backdrop.classList.add('hidden');
      },

      showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = {
          success: 'bg-[#172B4D] text-white border-l-4 border-[#12B76A]',
          warning: 'bg-[#172B4D] text-white border-l-4 border-amber-400',
          danger: 'bg-[#172B4D] text-white border-l-4 border-red-500',
          info: 'bg-[#172B4D] text-white border-l-4 border-[#155EEF]'
        };
        toast.className = `pointer-events-auto p-3.5 rounded-xl shadow-lg text-xs font-semibold flex items-center justify-between gap-3 transition-all duration-200 ${colors[type] || colors.info}`;
        toast.innerHTML = `<span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 220);
        }, 3200);
      }
    };

    // Close modal when clicking outside panel
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') App.closeModal();
    });

    // Boot Application on Window Load
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
